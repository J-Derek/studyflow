<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="StudyFlow — Never miss a deadline. Track weekly timetables, dynamic GPA modeling, and deep work focus sessions." />
    <meta name="keywords" content="study planner, GPA calculator, student productivity, timetable, Pomodoro timer, syllabus tracker" />
    <meta name="author" content="StudyFlow Team" />
    <link rel="canonical" href="https://app-beta-lilac-23.vercel.app/" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app-beta-lilac-23.vercel.app/" />
    <meta property="og:title" content="StudyFlow — Today, Timetable & GPA Simulator" />
    <meta property="og:description" content="Never miss a deadline. Track weekly timetables, dynamic GPA modeling, and deep work focus sessions." />
    <meta property="og:site_name" content="StudyFlow" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyFlow — Today, Timetable & GPA Simulator" />
    <meta name="twitter:description" content="Never miss a deadline. Track weekly timetables, dynamic GPA modeling, and deep work focus sessions." />

    <!-- Mobile & Theming -->
    <meta name="theme-color" content="#F8F9FA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>StudyFlow — Today, Timetable & GPA Simulator</title>

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "StudyFlow",
        "url": "https://app-beta-lilac-23.vercel.app/",
        "description": "Study planner with deadlines, a weekly timetable, a focus timer and a projected-GPA what-if calculator.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    
    <script>
      try {
        // The student's choice (light, dark or "system") is kept in its own entry, which signing out leaves alone.
        // Older saves only have it inside the saved data. With no choice at all the app starts light.
        let t = localStorage.getItem('studyflow_theme');
        if (t !== 'light' && t !== 'dark' && t !== 'system') {
          const s = JSON.parse(localStorage.getItem('studyflow_storage_v1') || '{}');
          t = s?.state?.theme === 'dark' ? 'dark' : 'light';
        }
        const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = dark ? '#090A0C' : '#F8F9FA';
      } catch {}
    </script>
  </head>
  <body class="bg-canvas-light dark:bg-canvas-dark text-zinc-900 dark:text-zinc-100 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
